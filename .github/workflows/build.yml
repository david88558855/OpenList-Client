name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  # 快速门禁：只有「错误」才失败（lint / warning 不阻断），比三平台编译早十分钟拿到语法错。
  analyze:
    name: static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze（仅错误阻断）
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: design/ 必须仍在 Git 跟踪中
        run: |
          set -e
          if git check-ignore -q design/OpenList-Client-Design.html; then
            echo "FAIL: design/ 被 .gitignore 忽略"; exit 1
          fi
          n=$(git ls-files design | wc -l)
          echo "design/ tracked files: $n"
          [ "$n" -gt 0 ] || { echo "FAIL: design/ 未入库"; exit 1; }

  android-arm64:
    name: Android arm64 APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 已预装 Android SDK 并接受 licenses；缺的平台/NDK 由 Gradle 自动下载。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze（提示性）
        continue-on-error: true
        run: flutter analyze

      - name: 构建 APK（含设计稿隔离断言）
        run: bash tool/ci_build_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error

      - name: 发布到 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: false

  windows-x64-portable:
    name: Windows x64 portable
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 构建便携版 zip（含设计稿隔离断言）
        shell: pwsh
        run: ./tool/ci_build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: 发布到 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: false
