name: build

# ⚠️ 永久规则（不可豁免）：构建 / 编译必须排除 design/ 及其下所有文件
#   - design/ 仅作视觉参照文档随仓库分发，永不参与编译、打包、资源清单；
#   - 落实点 1：tool/ci_build_android.sh、tool/ci_build_windows.ps1 在编译前物理剔除 design/，
#              并在构建结束后断言 design/ 不存在、产物中不出现设计稿；
#   - 落实点 2：.gitattributes 对 design/ 声明 export-ignore，git archive 生成的源码包不含它
#              （GitHub 的 zipball/tarball 不读 export-ignore，故不以此为保障）；
#   - 落实点 3：analysis_options.yaml 排除 design/**；pubspec assets 为白名单（仅 assets/tray/）；
#   - 新增任何构建入口（job、脚本、本地命令）时必须复用上述脚本或自行剔除 design/，
#     否则视为违规，PR/CI 一律不通过。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  # 快速门禁：只有「错误」才失败（lint / warning 不阻断），比三平台编译早十分钟拿到语法错。
  analyze:
    name: static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze（仅错误阻断）
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: design/ 必须仍在 Git 跟踪中
        run: |
          set -e
          if git check-ignore -q design/OpenList-Client-Design.html; then
            echo "FAIL: design/ 被 .gitignore 忽略"; exit 1
          fi
          n=$(git ls-files design | wc -l)
          echo "design/ tracked files: $n"
          [ "$n" -gt 0 ] || { echo "FAIL: design/ 未入库"; exit 1; }

      # K-01 回归：Windows 通知区域只认 ICO（Shell_NotifyIcon + LoadImage），
      # PNG 会得到 NULL HICON，表现为托盘空白。四态图标缺一即阻断。
      - name: 托盘四态图标必须为 .ico
        run: |
          set -e
          for s in idle transferring error paused; do
            f="assets/tray/tray_${s}.ico"
            [ -f "$f" ] || { echo "FAIL: 缺少 $f"; exit 1; }
            head -c 4 "$f" | od -An -tx1 | tr -d ' \n' | grep -q '00000100' || { echo "FAIL: $f 不是合法 ICO"; exit 1; }
          done
          echo "OK: 托盘四态 ICO 就绪"

      - name: 版本号一致性（pubspec ↔ lib/core/app_info.dart）
        run: |
          set -e
          pubver=$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9][0-9]*\).*/\1/p' pubspec.yaml)
          pubbuild=$(sed -n 's/^version: *[0-9][0-9.]*+\([0-9][0-9]*\).*/\1/p' pubspec.yaml)
          libver=$(sed -n "s/.*static const version = '\([0-9][0-9.]*\)';.*/\1/p" lib/core/app_info.dart)
          libbuild=$(sed -n "s/.*static const build = \([0-9][0-9]*\);.*/\1/p" lib/core/app_info.dart)
          echo "pubspec=$pubver+$pubbuild app_info=$libver+$libbuild"
          [ "$pubver" = "$libver" ] || { echo "FAIL: 版本号不一致"; exit 1; }
          [ "$pubbuild" = "$libbuild" ] || { echo "FAIL: build 号不一致"; exit 1; }

  android-arm64:
    name: Android arm64 APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 已预装 Android SDK 并接受 licenses；缺的平台/NDK 由 Gradle 自动下载。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze（提示性）
        continue-on-error: true
        run: flutter analyze

      - name: 构建 APK（含设计稿隔离断言）
        run: bash tool/ci_build_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error

      - name: 发布到 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: false

  windows-x64-portable:
    name: Windows x64 portable
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 构建便携版 zip（含设计稿隔离断言）
        shell: pwsh
        run: ./tool/ci_build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: 发布到 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: false
