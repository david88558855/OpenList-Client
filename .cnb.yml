# OpenList Client · CNB 云端构建
# 本仓库禁止本地编译：所有编译与产包都在这里完成。
#
# 设计稿（design/OpenList-Client-Design.html）只作视觉依据：
#   - pubspec.yaml 的 assets 是白名单，只声明 assets/tray/，设计稿不会被复制进 flutter_assets；
#   - analysis_options.yaml 已 exclude design/**，分析器不读它；
#   - tool/ci_build_android.sh 在产物里反查设计稿，命中即失败。
#
# 构建 / 发布逻辑都在 tool/ 下的脚本里（可审计、可复用）：
#   tool/ci_build_android.sh   出 APK + sha256 + 设计稿隔离断言
#   tool/ci_publish_release.sh 把 dist/*.apk 传到当前 tag 对应 CNB Release
#
# 如确认 CNB 支持路径过滤，可解开 skipIfModify：仅改设计稿/文档时不再触发构建。
# skipIfModify:
#   - design/**
#   - "**/*.md"
main:
  push:
    - name: flutter-build
      runner:
        tags:
          - cnb:arch:amd64
      docker:
        image: ghcr.io/cirruslabs/flutter:stable
        volumes:
          - /root/.pub-cache
          - /root/.gradle
      env:
        PUB_CACHE: /root/.pub-cache
        GRADLE_USER_HOME: /root/.gradle
        CI: "true"
      stages:
        - name: static-check
          jobs:
            - name: flutter-analyze
              # 静态检查只作提示，不阻塞出包；编译错误由下一个 stage 拦截。
              allowFailure: true
              timeout: 20m
              script: |
                set -e
                flutter config --no-analytics
                flutter --version
                flutter pub get
                flutter analyze
        - name: build-android
          jobs:
            - name: flutter-build-apk
              timeout: 60m
              script: |
                set -e
                sh tool/ci_build_android.sh

# 打 tag（v*）时：构建 + 把 APK 作为附件发布到该 tag 的 Release。
# Release 需提前创建（CNB 控制台或 OpenAPI）；脚本会重试查找，最多约 3 分钟。
"$":
  tag_push:
    - name: release
      runner:
        tags:
          - cnb:arch:amd64
      docker:
        image: ghcr.io/cirruslabs/flutter:stable
        volumes:
          - /root/.pub-cache
          - /root/.gradle
      env:
        PUB_CACHE: /root/.pub-cache
        GRADLE_USER_HOME: /root/.gradle
        CI: "true"
      stages:
        - name: build-android
          jobs:
            - name: flutter-build-apk
              timeout: 60m
              script: |
                set -e
                sh tool/ci_build_android.sh
        - name: publish-release
          jobs:
            - name: upload-apk
              timeout: 30m
              script: |
                set -e
                sh tool/ci_publish_release.sh
