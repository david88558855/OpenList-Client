# OpenList Client · CNB 云端构建
# 本仓库禁止本地编译：所有编译与产包都在这里完成。
#
# 产物（只有这两种，Windows 安装程序已永久移除）：
#   dist/OpenList-Client-<ver>-android-arm64.apk
#   dist/OpenList-Client-<ver>-windows-x64-portable.zip
#
# 设计稿（design/OpenList-Client-Design.html）只作视觉依据：
#   - pubspec.yaml 的 assets 是白名单，只声明 assets/tray/，设计稿不会被复制进 flutter_assets；
#   - analysis_options.yaml 已 exclude design/**，分析器不读它；
#   - 两条产物脚本都会在产物里反查设计稿，命中即失败。
#
# 构建 / 发布逻辑都在 tool/ 下的脚本里（可审计、可复用）：
#   tool/ci_build_android.sh    出 APK + sha256 + 设计稿隔离断言
#   tool/ci_build_windows.ps1   出便携版 zip + sha256（需 Windows 构建机）
#   tool/ci_publish_release.sh  把 dist/*.apk|*.zip 传到当前 tag 对应的 CNB Release（Linux）
#   tool/ci_publish_release.ps1 同上，Windows 侧实现
#
# 关于 Windows 构建机：Flutter 桌面端必须在 Windows + MSVC 上编译。
# CNB 社区版只提供 Linux runner，Windows 依赖根组织的自托管节点（runner.namespace: group）。
# 没有该节点时 windows 流水线会失败，但已标记 allowFailure，不影响 Linux 侧出包。
#
# 如确认 CNB 支持路径过滤，可解开 skipIfModify：仅改设计稿/文档时不再触发构建。
# skipIfModify:
#   - design/**
#   - "**/*.md"
main:
  push:
    - name: android-arm64
      runner:
        tags:
          - cnb:arch:amd64
      docker:
        image: ghcr.io/cirruslabs/flutter:stable
        volumes:
          - /root/.pub-cache
          - /root/.gradle
      env:
        PUB_CACHE: /root/.pub-cache
        GRADLE_USER_HOME: /root/.gradle
        CI: "true"
      stages:
        - name: static-check
          jobs:
            - name: flutter-analyze
              # 静态检查只作提示，不阻塞出包；编译错误由下一个 stage 拦截。
              allowFailure: true
              timeout: 20m
              script: |
                set -e
                flutter config --no-analytics
                flutter --version
                flutter pub get
                flutter analyze
        - name: build-android
          jobs:
            - name: flutter-build-apk
              timeout: 60m
              script: |
                set -e
                sh tool/ci_build_android.sh

# 打 tag（v*）：构建 + 把产物作为附件发布到该 tag 的 Release。
"$":
  tag_push:
    - name: release-android
      runner:
        tags:
          - cnb:arch:amd64
      docker:
        image: ghcr.io/cirruslabs/flutter:stable
        volumes:
          - /root/.pub-cache
          - /root/.gradle
      env:
        PUB_CACHE: /root/.pub-cache
        GRADLE_USER_HOME: /root/.gradle
        CI: "true"
      stages:
        - name: build-android
          jobs:
            - name: flutter-build-apk
              timeout: 60m
              script: |
                set -e
                sh tool/ci_build_android.sh
        - name: publish-release
          jobs:
            - name: upload-apk
              timeout: 30m
              script: |
                set -e
                sh tool/ci_publish_release.sh

